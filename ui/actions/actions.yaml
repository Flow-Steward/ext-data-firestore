{
  "actions": [
    {
      "action_id": "get_document",
      "workflow_visible": true,
      "title": "Read a document by path",
      "description": "Read one Firestore document with typed field values and create/update timestamps. Use a path relative to the configured database.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "document_path",
          "type": "string",
          "required": true
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.applied",
        "result.next_page_token"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "timeout",
        "authentication_failed"
      ],
      "mutates_platform": false
    },
