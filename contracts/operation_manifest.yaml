{
  "operations": [
    {
      "operation_id": "get_document",
      "display_name": "Read a document by path",
      "description": "Read one Firestore document with typed field values and create/update timestamps. Use a path relative to the configured database.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "firestore"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Project connection"
        },
        {
          "name": "document_path",
          "value_type": "text",
          "required": true,
          "display_name": "Document path",
          "schema": {
            "type": "string"
          }
        }
      ],
      "outputs": [
        {
          "name": "records",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        },
        {
          "name": "applied",
          "value_type": "boolean"
        },
        {
          "name": "next_page_token",
          "value_type": "text"
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.applied",
        "result.next_page_token"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "timeout",
        "authentication_failed"
      ]
    },
