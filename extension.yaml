{
  "manifest_version": 2,
  "extension_id": "flowsteward.firestore",
  "kind": "tool_provider",
  "version": "1.0.9",
  "release_stage": "active",
  "display_name": "Firestore",
  "description": "Use Google Cloud Firestore documents in Flow Steward workflows for application record lookup, collection queries and updates. Actions read a document, create at a stable path, replace or upsert its fields, patch selected top-level fields, and delete it. Collection actions list documents, query with typed filters and ordering, or list root collections and subcollections. Listing returns a page token for explicit continuation.\n\nFirestore's typed Value JSON supports strings, booleans, numbers, timestamps, bytes, geographic points, references, arrays and maps. Integer values can retain full int64 precision as strings inside their Firestore type representation. Optional update-time preconditions help reject stale updates, replacements and deletes; creation fails when the supplied path already exists. Choose patches for individual field changes or replacements when a workflow owns the complete document.\n\nConfigure the Google Cloud project and database with an access token or service-account JSON and appropriate Firestore IAM permissions. Queries and pages return at most 100 documents, and some filters require an existing Firestore index. Document deletion does not recursively remove subcollections. The connector provides Firestore document operations rather than transactions, triggers, Rules management or Firebase Realtime Database access.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "firestore",
      "documents",
      "google-cloud"
    ],
    "summary": "Get, query, create, patch, replace and delete typed Firestore documents, with pagination and version preconditions.",
    "setup_summary": "Create a Firestore project connection with the Google Cloud project, database and exactly one secret: an access token or service-account JSON. Grant the required Firestore IAM permissions and provision any indexes needed by your collection queries."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "hosts": [
      "firestore.googleapis.com",
      "oauth2.googleapis.com"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project Firestore connections."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "create_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "update_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_firestore",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
