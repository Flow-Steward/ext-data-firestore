{
  "manifest_version": 2,
  "extension_id": "flowsteward.firestore",
  "kind": "tool_provider",
  "version": "1.0.3",
  "release_stage": "active",
  "display_name": "Firestore",
  "description": "Typed Firestore document reads and writes through a managed Google Cloud native adapter.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "firestore",
      "documents",
      "google-cloud"
    ],
    "summary": "Bounded typed Firestore document CRUD and query."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "hosts": [
      "firestore.googleapis.com",
      "oauth2.googleapis.com"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project Firestore connections."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "create_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "update_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_document",
      "effect_kind": "database_write",
      "channel": "firestore",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_firestore",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
